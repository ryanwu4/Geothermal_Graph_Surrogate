datasets:
  hard_fulldepth:
    h5_path: ablation_datasets/hard_fulldepth/seed_compiled.h5
  highperf_cma:
    h5_path: ablation_datasets/highperf_cma/compiled.h5
    max_concurrent: 2
  simple_2pair:
    h5_path: ablation_datasets/simple_2pair/seed_compiled.h5
exclude: []
output_root: analysis/surrogate_ablation/runs/stage2_data_efficiency
overrides: []
python: /home/rwu4/miniconda3/envs/geothermal-pomdp/bin/python
scheduler:
  gpus:
  - 0
  max_concurrent_per_gpu: 2
seeds:
- 42
- 43
- 44
shared:
  batch_size: 16
  cache_to_gpu: true
  early_stop_patience: 40
  max_epochs: 180
  split_seed: 42
  test_fraction: 0.15
  val_fraction: 0.15
svd:
  k: 32
  max_cases_fit: 300
  max_slabs: 12000
targets:
- graph_discounted_net_revenue
- node_wept_final
variants:
  global_cnn:
    flags:
      learning-rate: 0.0003
      model: global_cnn
      widths: 16,32,64,128
    gpu: 0
    kind: baseline
  gnn_default:
    flags:
      edge-encoder: cnn
    gpu: 0
    kind: train_py
  gnn_dist_edge:
    flags:
      edge-encoder: dist
    gpu: 0
    kind: train_py
  gnn_no_cnn:
    flags:
      edge-encoder: dist
      node-encoder: profile
      node-features: type_only
    gpu: 0
    kind: train_py
  gnn_svd_edge:
    flags:
      edge-encoder: svd
    gpu: 0
    kind: train_py
  gnn_type_only_nodes:
    flags:
      node-encoder: profile
      node-features: type_only
    gpu: 0
    kind: train_py
  mlp:
    flags:
      dropout: 0.1
      hidden-dims: 512,512,256
      learning-rate: 0.001
      model: mlp
    gpu: 0
    kind: baseline
train_sizes:
- 256
- 512
_note: 'STAGE 2 (data efficiency): 7 variants x 3 datasets x 2 targets x {256,512}
  train sizes x 3 seeds = 252 fast jobs. Train subsample is geology-proportional,
  seeded by the run seed (identical across variants at the same seed); val/test splits
  identical to stage 1 -> metrics directly comparable. Full-size anchors = stage1
  (incl. its seed top-up).'
